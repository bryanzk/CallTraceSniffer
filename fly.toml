# Fly.io 配置文件
# 使用: fly launch 初始化，或直接使用此配置

app = "calltrace-sniffer"
primary_region = "iad"  # 可选: iad (US), hkg (HK), sin (SG), etc.

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  PORT = "5001"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
